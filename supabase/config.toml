# For detailed configuration reference documentation, see:
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "attendance-system"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "https://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = true

[functions.issue-qr-token]
verify_jwt = false

[functions.verify-checkin]
verify_jwt = false

[functions.webauthn-register]
verify_jwt = false

[functions.webauthn-authenticate]
verify_jwt = false
